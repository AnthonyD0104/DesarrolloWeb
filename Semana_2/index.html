<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Google</title>
</head>

<body class="layout">
    <header class="header">

        <a href="#">Gmail</a>
        <a href="#">Imágenes</a>
        <img class="apps" src="./imagenes/apps-icon.png" alt="Apps" />
        <img class="profile" src="./imagenes/user-img.jpg" alt="Cuenta" />
    </header>
    <main class="main">

        <img class="logo" src="./imagenes/google-logo.png" alt="Google Logo"  />

        <form action="https://www.google.com/search" method="GET">
            <input 
                type="text" 
                placeholder="Buscar en Google"
                name="q"
                required
            >
            <div class="buttoms">
                <button type="submit">Buscar con Google</button>
                <button type="button">Me siento con suerte</button>
            </div>
        </form>
        <p class="language">
            Google disponible en:
            <a href="#">Español (Latinoamérica)</a>
        </p>
    </main>

    <footer class="footer">
        <div class="country">Ecuador</div>
        <div class="footer-links">
        <div>
        <a href="#">Publicidad</a>
        <a href="#">Negocios</a>
        <a href="#">Acerca de Google</a>
        </div>
        <div>
            <a href="#">Privacidad</a>
            <a href="#">Términos</a>
            <a href="#">Configuración</a>
        </div>
    </footer>
</body>

</html>
