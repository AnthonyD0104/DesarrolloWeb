<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Práctica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="./scripts/funciones.js"></script>
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Prueba Semana 4</a>
            <div class="navbar-nav">
                <a class="nav-link text-white-50" href="./index.html">Teórico</a>
                <a class="nav-link active fw-bold" href="./practica.html">Práctico</a>
            </div>
        </div>
    </nav>
    <main class="flex-grow-1">
        <div class="container mt-5">
            <h1 class="text-center text-primary fw-bold mb-5">PARTE PRÁCTICA</h1>
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="card shadow-lg border-0 text-center p-4">
                        <h4 class="mb-4 fw-bold text-secondary">Simulador de Semáforo</h4>
                        <div class="d-flex flex-column align-items-center gap-3 mb-4">
                            <div id="rojo" class="rounded-circle bg-secondary" style="width:90px;height:90px;"></div>
                            <div id="amarillo" class="rounded-circle bg-secondary" style="width:90px;height:90px;"></div>
                            <div id="verde" class="rounded-circle bg-secondary" style="width:90px;height:90px;"></div>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-danger" onclick="cambiarLuz('rojo')">
                                Luz Roja
                            </button>
                            <button class="btn btn-warning" onclick="cambiarLuz('amarillo')">
                                Luz Amarilla
                            </button>
                            <button class="btn btn-success" onclick="cambiarLuz('verde')">
                                Luz Verde
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div> 
    </main>
    <footer class="bg-primary text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0 fw-semibold">
                Realizado por Anthony Dávila
            </p>
        </div>
    </footer>
</body>

</html>
